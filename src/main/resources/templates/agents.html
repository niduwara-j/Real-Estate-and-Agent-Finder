<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Find Real Estate Agents')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container my-5">
    <!-- Header -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-extrabold mb-1">Find Real Estate Agents</h2>
            <p class="text-muted small">Connect with verified real estate specialists and advisors in your area</p>
        </div>
        <div>
            <a th:href="@{/register}" class="btn btn-outline-primary btn-sm fw-semibold rounded-pill px-3">
                <i class="bi bi-person-plus"></i> Join as an Agent
            </a>
        </div>
    </div>

    <!-- Search & Filter Bar -->
    <div class="custom-card p-4 mb-4">
        <form th:action="@{/agents}" method="get" class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label small fw-semibold">Search by Name or Area</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control border-start-0" placeholder="e.g. Sarah, Malabe, Colombo...">
                </div>
            </div>

            <div class="col-md-3">
                <label class="form-label small fw-semibold">Specialization</label>
                <select name="spec" class="form-select">
                    <option value="">All Specializations</option>
                    <option th:each="sp : ${specializations}" th:value="${sp}" th:text="${sp.displayName}" th:selected="${selectedSpec == sp}"></option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label small fw-semibold">Sort By</label>
                <select name="sortBy" class="form-select">
                    <option value="rating" th:selected="${selectedSort == 'rating'}">★ Highest Rating</option>
                    <option value="experience" th:selected="${selectedSort == 'experience'}">⚡ Most Experienced</option>
                </select>
            </div>

            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100 fw-bold rounded-3">
                    <i class="bi bi-filter"></i> Apply Filters
                </button>
            </div>
        </form>
    </div>

    <!-- Agent Cards Grid -->
    <div th:if="${#lists.isEmpty(agents)}" class="text-center py-5 bg-white rounded-3 border">
        <i class="bi bi-person-x fs-1 text-muted d-block mb-2"></i>
        <h5 class="fw-bold">No Agents Found</h5>
        <p class="text-muted small">Try broadening your search keyword or clearing the filters.</p>
        <a th:href="@{/agents}" class="btn btn-outline-primary btn-sm rounded-pill px-3">Clear All Filters</a>
    </div>

    <div class="row g-4" th:unless="${#lists.isEmpty(agents)}">
        <div class="col-lg-4 col-md-6 agent-card-item" th:each="agent : ${agents}">
            <div class="custom-card h-100 p-4 d-flex flex-column">
                <div class="d-flex align-items-start gap-3 mb-3">
                    <div class="position-relative">
                        <img th:src="${agent.profilePicture}" th:alt="${agent.name}" class="agent-avatar">
                        <span th:if="${agent.verified}" class="position-absolute bottom-0 end-0 bg-success text-white rounded-circle px-1" title="Verified Professional">
                            <i class="bi bi-check"></i>
                        </span>
                    </div>
                    <div class="flex-grow-1">
                        <div class="d-flex align-items-center gap-1">
                            <h5 class="fw-bold mb-0" th:text="${agent.name}">Agent Name</h5>
                        </div>
                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle small mt-1" th:text="${agent.specialization.displayName}">Residential</span>
                        <div class="mt-1">
                            <span class="star-rating">
                                <i class="bi bi-star-fill text-warning"></i>
                                <span class="fw-bold text-dark ms-1" th:text="${agent.rating}">4.8</span>
                            </span>
                            <span class="text-muted small" th:text="'(' + ${agent.reviewCount} + ' reviews)'">(10)</span>
                        </div>
                    </div>
                </div>

                <div class="small text-muted mb-2">
                    <i class="bi bi-briefcase text-secondary"></i> <strong th:text="${agent.yearsOfExperience}">5</strong> years experience
                </div>
                <div class="small text-muted mb-3 bg-light p-2 rounded">
                    <i class="bi bi-geo-alt text-danger"></i> <span th:text="${agent.serviceAreas}">Malabe, Colombo</span>
                </div>

                <p class="small text-muted flex-grow-1" th:text="${agent.bio != null ? agent.bio : 'Professional real estate advisor dedicated to delivering results.'}">Bio</p>

                <div class="d-flex gap-2 mt-3 pt-3 border-top">
                    <a th:href="@{'/agents/' + ${agent.id}}" class="btn btn-primary w-100 fw-semibold btn-sm rounded-3">
                        <i class="bi bi-calendar-check"></i> Profile & Book
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
