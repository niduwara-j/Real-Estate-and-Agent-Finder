<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add Property Listing')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="custom-card p-4 p-md-5 shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1">Add New Property Listing</h3>
                        <p class="text-muted small">Publish a new real estate property to the platform directory</p>
                    </div>
                    <a th:href="@{/agent/dashboard}" class="btn btn-outline-secondary btn-sm">Back to Dashboard</a>
                </div>

                <form th:action="@{/properties/add}" method="post">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-semibold small">Property Title *</label>
                            <input type="text" name="title" class="form-control" placeholder="e.g. Modern Luxury 4-Bedroom Villa with Pool" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Price (LKR) *</label>
                            <input type="number" step="10000" name="price" class="form-control" placeholder="e.g. 45000000" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Property Type *</label>
                            <select name="propertyType" class="form-select" required>
                                <option th:each="pt : ${propertyTypes}" th:value="${pt}" th:text="${pt}"></option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Address / Street *</label>
                            <input type="text" name="address" class="form-control" placeholder="e.g. 45 Green View Avenue" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">City *</label>
                            <input type="text" name="city" class="form-control" placeholder="e.g. Malabe" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">State / Province</label>
                            <input type="text" name="state" class="form-control" placeholder="e.g. Western Province" value="Western Province">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Zip / Postal Code</label>
                            <input type="text" name="zipCode" class="form-control" placeholder="e.g. 10115">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold small">Bedrooms</label>
                            <input type="number" name="bedrooms" class="form-control" min="0" value="3">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold small">Bathrooms</label>
                            <input type="number" name="bathrooms" class="form-control" min="0" value="2">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold small">Area (Sq. Ft)</label>
                            <input type="number" step="10" name="areaSqFt" class="form-control" min="100" value="1800">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold small">Image URL</label>
                            <input type="url" name="imageUrl" class="form-control" placeholder="https://images.unsplash.com/photo-...">
                            <div class="form-text">Leave blank to use a high-resolution default property image.</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold small">Listing Status</label>
                            <select name="status" class="form-select">
                                <option value="FOR_SALE">For Sale</option>
                                <option value="FOR_RENT">For Rent</option>
                                <option value="SOLD">Sold</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold small">Detailed Description *</label>
                            <textarea name="description" rows="4" class="form-control" placeholder="Describe the key features, architecture, neighborhood, and amenities..." required></textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-4 shadow-sm">
                        <i class="bi bi-check2-circle"></i> Publish Property Listing
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
